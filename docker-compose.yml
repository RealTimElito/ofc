services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OFC_DATA_DIR: /data
      OFC_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      # Reach host Ollama from container (Linux)
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8080:80"
    depends_on:
      - api
